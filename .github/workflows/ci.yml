# Every push to main or develop and every pull request: the full ./mvnw verify (formatting, checkstyle, unit and
# integration tests on an embedded PostgreSQL, coverage, frontend checks) and a build of the Docker image.
# Make the "verify" check required for merging: Settings -> Branches -> branch protection rule -> Require status checks.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: ./mvnw verify
        run: ./mvnw -B verify

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            backend/target/site/jacoco/
            backend/target/site/jacoco-all/
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: docker image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: inside-joke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
